# TigerGraph GraphStudio Authentic Theme (Light / Studio Canvas)
# Matches TigerGraph GraphStudio v4.2.5 UI design

[theme]
base = "light"
primaryColor = "#FA6400"              # TigerGraph signature orange
backgroundColor = "#F3F4F6"           # GraphStudio canvas neutral studio gray
secondaryBackgroundColor = "#FFFFFF"  # Crisp white sidebar, cards, and toolbars
codeBackgroundColor = "#FFFFFF"
textColor = "#1F2937"                 # Crisp slate/charcoal text
linkColor = "#FA6400"
borderColor = "#E5E7EB"
codeTextColor = "#1F2937"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"

# Typography
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# TigerGraph GraphStudio palette
orangeColor = "#FA6400"
blueColor = "#2563EB"
greenColor = "#059669"
redColor = "#DC2626"
yellowColor = "#D97706"
violetColor = "#7C3AED"
grayColor = "#6B7280"

# Charts palette
chartCategoricalColors = [
    "#FA6400",
    "#2563EB",
    "#059669",
    "#7C3AED",
    "#DC2626",
    "#D97706",
    "#6B7280",
]

dataframeBorderColor = "#E5E7EB"
dataframeHeaderBackgroundColor = "#F9FAFB"

# Sidebar — Crisp white with subtle border and orange active accent
[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#1F2937"
borderColor = "#E5E7EB"
primaryColor = "#FA6400"
